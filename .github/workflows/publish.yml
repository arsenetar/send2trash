name: Publish

on:
  push:
    tags: 
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
      # Needed to list runs and download artifacts from them
      actions: read
    steps:
      - name: Get artifact run
        id: get_artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list --workflow "Default CI/CD" --branch master --commit "${{ github.sha }}" --status completed --limit 1 --json databaseId --jq ".[].databaseId")
          if [ -z "$RUN_ID" ]; then
            echo "No completed workflow run found for commit ${{ github.sha }}"
            exit 1
          fi
          echo "run=$RUN_ID" >> $GITHUB_OUTPUT
      - name: Fetch build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.get_artifact_run.outputs.run }}
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
