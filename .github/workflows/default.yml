# Workflow lints, and checks format in parallel then runs tests on all platforms

name: Default CI/CD

on: 
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.x
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 .
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: 3.15
          - os: ubuntu-latest
            python-version: 3.14
          - os: ubuntu-latest
            python-version: 3.13
          - os: ubuntu-latest
            python-version: 3.12
          - os: ubuntu-latest
            python-version: 3.11
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: 3.9
          - os: ubuntu-24.04
            python-version: 3.8
          - os: macos-latest
            python-version: 3.15
          - os: macos-latest
            python-version: 3.14
          - os: macos-latest
            python-version: 3.9
          - os: windows-latest
            python-version: 3.15
          - os: windows-latest
            python-version: 3.14
          - os: windows-latest
            python-version: 3.8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Install windows dependencies
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          pip install pywin32
      - name: Install macOS dependencies
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          pip install pyobjc-framework-Cocoa
      - name: Run tests
        run: |
          pytest
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.x
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools build
      - name: Build package
        run: |
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
